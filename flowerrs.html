<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas del Ferxxo 💚</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a120c, #113a1a, #000000);
            color: white;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(10, 20, 15, 0.8);
            border: 2px solid #39ff14; /* Verde neón Ferxxo */
            border-radius: 20px;
            max-width: 800px;
            z-index: 10;
            padding: 40px 20px;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.1);
            animation: slideUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            backdrop-filter: blur(5px);
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14;
            letter-spacing: 2px;
        }
        
        p {
            font-size: 1.4rem;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #e0e0e0;
        }
        
        .btn {
            background-color: transparent;
            color: #39ff14;
            border: 2px solid #39ff14;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            margin: 10px;
            text-transform: uppercase;
        }
        
        .btn:hover {
            background-color: #39ff14;
            color: #000;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
        }
        
        /* Flores mejoradas */
        .flower {
            position: absolute;
            top: -50px;
            z-index: 1;
            opacity: 0.9;
            animation-name: fall;
            animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1);
            animation-iteration-count: infinite;
            filter: drop-shadow(0 0 5px rgba(255, 235, 59, 0.5));
        }
        
        .flower .petal {
            position: absolute;
            background: radial-gradient(circle, #ffee58, #fbc02d);
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            border: 1px solid rgba(255, 193, 7, 0.5);
        }
        
        .flower .center {
            position: absolute;
            background: radial-gradient(circle, #5d4037, #3e2723);
            border-radius: 50%;
            z-index: 2;
            border: 2px solid #fbc02d;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
        
        .counter {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #39ff14;
            font-weight: bold;
        }
        
        .message {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ffffff;
            font-style: italic;
        }

        /* Avatar del Ferxxo Animado */
        .ferxxo-avatar {
            position: fixed;
            bottom: -150px;
            right: 20px;
            width: 120px;
            z-index: 20;
            animation: popUp 1s 1.5s forwards, bounce 2s 2.5s infinite alternate;
            text-align: center;
        }

        .ferxxo-avatar .emoji {
            font-size: 4rem;
            filter: drop-shadow(0 0 10px #39ff14);
        }

        .ferxxo-avatar .bubble {
            background: white;
            color: black;
            padding: 8px 12px;
            border-radius: 15px 15px 0 15px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            animation: fadeIn 0.5s 2.5s forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes popUp {
            to { bottom: 20px; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; }
            .ferxxo-avatar { right: 10px; width: 100px; }
            .ferxxo-avatar .emoji { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Carla Sarmiento</h1>
        <p>Mor, el Ferxxo no te iba a dejar sin tus flores amarillas. ¡Mera belleza!</p>
        
        <div>
            <button class="btn" id="addFlowers">Más flores ps mor</button>
            <button class="btn" id="changeBackground">Cambiar la vibra</button>
        </div>
        
        <div class="counter">
            Flores en el cora: <span id="flowerCount">0</span> 💚
        </div>
        
        <div class="message" id="message">
            Las flores amarillas unen amistades, mor.
        </div>
    </div>

    <!-- Animación del Ferxxo -->
    <div class="ferxxo-avatar">
        <div class="bubble">¡Feliz lunes, mor! Toma tus flores 🌻</div>
        <div class="emoji">😎🧢</div>
    </div>

    <script>
        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower';
            
            const size = Math.random() * 30 + 25; // Ligeramente más grandes
            
            for (let i = 0; i < 8; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.transform = `rotate(${i * 45}deg)`;
                flower.appendChild(petal);
            }
            
            const center = document.createElement('div');
            center.className = 'center';
            center.style.width = `${size * 0.45}px`;
            center.style.height = `${size * 0.45}px`;
            center.style.top = `${size * 0.28}px`;
            center.style.left = `${size * 0.28}px`;
            flower.appendChild(center);
            
            flower.style.left = `${Math.random() * 95}vw`;
            flower.style.animationDuration = `${Math.random() * 6 + 4}s`; // Caen un poco más rápido
            flower.style.animationDelay = `${Math.random() * 3}s`;
            
            document.body.appendChild(flower);
            
            setTimeout(() => {
                if (flower.parentNode) {
                    flower.parentNode.removeChild(flower);
                    updateFlowerCount();
                }
            }, parseFloat(flower.style.animationDuration) * 1000);
            
            updateFlowerCount();
            return flower;
        }
        
        function updateFlowerCount() {
            const flowers = document.querySelectorAll('.flower');
            document.getElementById('flowerCount').textContent = flowers.length;
        }
        
        // Crear flores iniciales
        for (let i = 0; i < 20; i++) {
            createFlower();
        }
        
        // Botón "Más flores"
        document.getElementById('addFlowers').addEventListener('click', () => {
            for (let i = 0; i < 15; i++) {
                createFlower();
            }
            
            const message = document.getElementById('message');
            message.style.color = '#39ff14';
            message.textContent = "¡Qué chimba de flores para la más hermosa! 💚";
            setTimeout(() => {
                message.style.color = '#ffffff';
                message.textContent = "Las flores amarillas unen amistades, mor.";
            }, 3000);
        });
        
        // Botón "Cambiar la vibra"
        document.getElementById('changeBackground').addEventListener('click', () => {
            const colors = [
                'linear-gradient(135deg, #000000, #39ff14, #000000)',
                'linear-gradient(135deg, #111111, #0a5a22, #000000)',
                'linear-gradient(135deg, #050505, #1db954, #191414)',
                'linear-gradient(135deg, #000000, #2b2b2b, #39ff14)'
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.background = randomColor;
        });
        
        // Interactividad con el mouse
        let isMouseDown = false;
        
        document.addEventListener('mousedown', () => isMouseDown = true);
        document.addEventListener('mouseup', () => isMouseDown = false);
        
        document.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                // Filtro para no crear demasiadas flores de golpe y saturar la pantalla
                if (Math.random() > 0.7) {
                    const flower = createFlower();
                    flower.style.left = `${e.clientX - 20}px`;
                    flower.style.top = `${e.clientY - 20}px`;
                    flower.style.animationDuration = '2.5s';
                }
            }
        });
    </script>
</body>
</html>
